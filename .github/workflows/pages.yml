name: Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - PRIVACY.md
      - CHANGELOG.md
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render Markdown to static HTML
        run: |
          python3 - <<'PY'
          import html, pathlib, re

          def render(md_path, title):
              text = pathlib.Path(md_path).read_text(encoding="utf-8")
              lines, out = text.splitlines(), []
              for line in lines:
                  esc = html.escape(line)
                  if line.startswith("### "):
                      out.append(f"<h3>{esc[4:]}</h3>")
                  elif line.startswith("## "):
                      out.append(f"<h2>{esc[3:]}</h2>")
                  elif line.startswith("# "):
                      out.append(f"<h1>{esc[2:]}</h1>")
                  elif line.startswith("- "):
                      out.append(f"<li>{esc[2:]}</li>")
                  elif line.strip() == "":
                      out.append("")
                  else:
                      out.append(f"<p>{esc}</p>")
              body = "\n".join(out)
              body = re.sub(r"(<li>.*?</li>\n?)+",
                            lambda m: f"<ul>{m.group(0)}</ul>", body,
                            flags=re.S)
              return (
                  "<!doctype html><html lang=\"en\"><head>"
                  "<meta charset=\"utf-8\">"
                  "<meta name=\"viewport\" content=\"width=device-width,"
                  "initial-scale=1\">"
                  f"<title>{html.escape(title)}</title>"
                  "<style>body{max-width:44rem;margin:2rem auto;padding:0 1rem;"
                  "font-family:system-ui,sans-serif;line-height:1.6}"
                  "h1,h2,h3{line-height:1.25}</style></head><body>"
                  f"{body}</body></html>"
              )

          site = pathlib.Path("_site")
          site.mkdir(exist_ok=True)
          (site / "privacy.html").write_text(
              render("PRIVACY.md", "Tessera — Privacy Policy"),
              encoding="utf-8")
          (site / "changelog.html").write_text(
              render("CHANGELOG.md", "Tessera — Changelog"),
              encoding="utf-8")
          # The landing page is the site home; it links to privacy.html.
          import shutil
          shutil.copyfile("index.html", site / "index.html")
          print("rendered:", [p.name for p in site.iterdir()])
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
