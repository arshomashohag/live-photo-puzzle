org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# This build requires JDK 21 (AGP 8.6 does not support newer defaults such as
# JDK 26). Do NOT hardcode org.gradle.java.home here — it is machine-specific
# and breaks CI/other machines. Instead run Gradle with JDK 21 on PATH, e.g.
#   JAVA_HOME=$(/usr/libexec/java_home -v 21) ./gradlew ...
# or pin org.gradle.java.home in your untracked ~/.gradle/gradle.properties.
# CI provides JDK 21 via actions/setup-java, so no pin is needed there.
